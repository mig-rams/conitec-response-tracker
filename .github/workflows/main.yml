name: Track CONITEC Responses

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-responses:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Download page
        run: |
          curl -L --retry 5 --retry-delay 5 \
            -A "Mozilla/5.0" \
            -o page.html \
            "https://brasilparticipativo.presidencia.gov.br/processes/consultas-publicas-conitec/f/5686/"

      - name: Extract response count
        run: |
          python - <<'PY'
          import re

          text = open("page.html", encoding="utf-8").read()

          # Remove HTML tags
          text = re.sub(r"<[^>]+>", " ", text)

          # Find the number immediately before "Respostas"
          match = re.search(
              r"(\d[\d.]*)\s+Respostas",
              text,
              re.IGNORECASE
          )

          if not match:
              print("Could not find response count.")
              print("Searching for 'Respostas' manually...")

              for match2 in re.finditer(
                  r".{0,100}Respostas.{0,100}",
                  text,
                  re.IGNORECASE
              ):
                  print(match2.group(0))

              raise Exception("Could not find response count")

          responses = int(
              match.group(1)
              .replace(".", "")
              .replace(",", "")
          )

          print(f"RESPOSTAS: {responses}")

          # Save the number for the next step
          with open("response_count.txt", "w") as file:
              file.write(str(responses))
          PY

      - name: Save response count to CSV
        run: |
          RESPONSES=$(cat response_count.txt)
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          if [ ! -f responses.csv ]; then
            echo "timestamp,responses" > responses.csv
          fi

          echo "$TIMESTAMP,$RESPONSES" >> responses.csv

          echo "Saved: $TIMESTAMP → $RESPONSES respostas"

      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add responses.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update response count"
            git push
          fi
