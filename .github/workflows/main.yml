name: Track CONITEC Responses

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-responses:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Download page
        run: |
          curl -L --retry 5 --retry-delay 5 \
            -A "Mozilla/5.0" \
            -o page.html \
            "https://brasilparticipativo.presidencia.gov.br/processes/consultas-publicas-conitec/f/5686/"

      - name: Check responses
        run: |
          python -c "import re; t=open('page.html',encoding='utf-8').read(); m=re.search(r'(\d[\d.]*)\s*Respostas',t,re.I); print('RESPOSTAS:',m.group(1) if m else 'NOT FOUND')"

      - name: Save response count
        run: |
          python - <<'PY'
          import re
          import csv
          import os
          from datetime import datetime, timezone

          text = open("page.html", encoding="utf-8").read()

          match = re.search(
              r'(\d[\d.]*)\s*Respostas',
              text,
              re.IGNORECASE
          )

          if not match:
              raise Exception("Could not find response count")

          responses = int(match.group(1).replace(".", "").replace(",", ""))

          timestamp = datetime.now(timezone.utc).strftime(
              "%Y-%m-%d %H:%M:%S UTC"
          )

          file_exists = os.path.exists("responses.csv")

          with open(
              "responses.csv",
              "a",
              newline="",
              encoding="utf-8"
          ) as file:
              writer = csv.writer(file)

              if not file_exists:
                  writer.writerow(["timestamp", "responses"])

              writer.writerow([timestamp, responses])

          print(f"{timestamp} → {responses} respostas")
          PY

      - name: Save CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add responses.csv
          git diff --cached --quiet || git commit -m "Update response count"
          git push
