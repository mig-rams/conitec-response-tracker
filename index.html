<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monitor de Respostas — CONITEC</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .label {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .value {
            font-size: 30px;
            font-weight: bold;
        }

        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .chart-card h2 {
            margin-top: 0;
        }

        .chart-container {
            position: relative;
            height: 450px;
        }

        .updated {
            margin-top: 20px;
            color: #6b7280;
            font-size: 13px;
            text-align: right;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .cards {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 25px;
            }

            .chart-container {
                height: 350px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Monitor de Respostas da CONITEC</h1>

    <div class="subtitle">
        Brasil Participativo — Consulta Pública CONITEC
    </div>

    <div id="dashboard">

        <div class="cards">

            <div class="card">
                <div class="label">Total de respostas</div>
                <div class="value" id="current">—</div>
            </div>

            <div class="card">
                <div class="label">Desde a última verificação</div>
                <div class="value" id="lastChange">—</div>
            </div>

            <div class="card">
                <div class="label">Últimas 24 horas</div>
                <div class="value" id="dayChange">—</div>
            </div>

            <div class="card">
                <div class="label">Média por hora</div>
                <div class="value" id="average">—</div>
            </div>

        </div>

        <div class="chart-card">

            <h2>Histórico de respostas</h2>

            <div class="chart-container">
                <canvas id="responseChart"></canvas>
            </div>

            <div class="updated" id="updated">
                Carregando...
            </div>

        </div>

    </div>

</div>

<script>

async function loadData() {

    try {

        const url = "responses.csv?t=" + Date.now();

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Não foi possível carregar os dados.");
        }

        const text = await response.text();

        const lines = text.trim().split(/\r?\n/);

        if (lines.length < 2) {
            throw new Error("Ainda não há dados suficientes.");
        }

        const data = lines.slice(1)
            .map(line => {

                const comma = line.lastIndexOf(",");

                if (comma === -1) {
                    return null;
                }

                const timestamp =
                    line.substring(0, comma).trim();

                const responses =
                    Number(line.substring(comma + 1).trim());

                return {
                    timestamp,
                    responses
                };

            })
            .filter(row =>
                row &&
                !isNaN(row.responses)
            );

        if (data.length === 0) {
            throw new Error("Nenhum dado válido encontrado.");
        }

        const latest = data[data.length - 1];

        document.getElementById("current").textContent =
            latest.responses.toLocaleString("pt-BR");


        // ==========================
        // DESDE A ÚLTIMA VERIFICAÇÃO
        // ==========================

        if (data.length >= 2) {

            const previous = data[data.length - 2];

            const change =
                latest.responses - previous.responses;

            document.getElementById("lastChange").textContent =
                (change >= 0 ? "+" : "") +
                change.toLocaleString("pt-BR");

        }


        // ==========================
        // ÚLTIMAS 24 HORAS
        // ==========================

        const latestTime =
            new Date(
                latest.timestamp.replace(" UTC", "Z")
            );

        const yesterday =
            new Date(
                latestTime.getTime() -
                24 * 60 * 60 * 1000
            );

        let oldData = data[0];

        for (const row of data) {

            const rowTime =
                new Date(
                    row.timestamp.replace(" UTC", "Z")
                );

            if (rowTime <= yesterday) {
                oldData = row;
            }

        }

        const dayChange =
            latest.responses - oldData.responses;

        document.getElementById("dayChange").textContent =
            (dayChange >= 0 ? "+" : "") +
            dayChange.toLocaleString("pt-BR");


        // ==========================
        // MÉDIA POR HORA
        // ==========================

        if (data.length >= 2) {

            const firstTime =
                new Date(
                    data[0].timestamp.replace(" UTC", "Z")
                );

            const hours =
                (latestTime - firstTime) / 3600000;

            if (hours > 0) {

                const totalIncrease =
                    latest.responses - data[0].responses;

                const average =
                    totalIncrease / hours;

                document.getElementById("average").textContent =
                    (average >= 0 ? "+" : "") +
                    average.toLocaleString(
                        "pt-BR",
                        {
                            minimumFractionDigits: 1,
                            maximumFractionDigits: 1
                        }
                    );

            }

        }


        // ==========================
        // ÚLTIMA ATUALIZAÇÃO
        // ==========================

        document.getElementById("updated").textContent =
            "Última verificação: " +
            latest.timestamp;


        // ==========================
        // GRÁFICO
        // ==========================

        const labels = data.map(row => {

            const date =
                new Date(
                    row.timestamp.replace(" UTC", "Z")
                );

            return date.toLocaleString(
                "pt-BR",
                {
                    day: "2-digit",
                    month: "2-digit",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        });

        const values =
            data.map(row => row.responses);


        new Chart(
            document.getElementById("responseChart"),
            {
                type: "line",

                data: {
                    labels: labels,

                    datasets: [{
                        label: "Respostas",
                        data: values,
                        borderWidth: 2,
                        pointRadius: 2,
                        tension: 0.2
                    }]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: false,

                    interaction: {
                        intersect: false,
                        mode: "index"
                    },

                    scales: {

                        y: {
                            beginAtZero: false,

                            ticks: {
                                callback: function(value) {
                                    return value.toLocaleString("pt-BR");
                                }
                            }
                        }

                    },

                    plugins: {

                        legend: {
                            display: true
                        },

                        tooltip: {

                            callbacks: {

                                label: function(context) {

                                    return (
                                        "Respostas: " +
                                        context.parsed.y.toLocaleString(
                                            "pt-BR"
                                        )
                                    );

                                }

                            }

                        }

                    }

                }

            }
        );

    } catch (error) {

        document.getElementById("dashboard").innerHTML =
            '<div class="error">' +
            'Erro ao carregar os dados: ' +
            error.message +
            '</div>';

    }

}

loadData();

</script>

</body>
</html>
